<!--
  laydoh demo - Clay layout logic written in yap, running in the
  browser via yap's -bcc=emcc backend. Card 0 (bottom-left) animates its own
  width every frame so its text visibly reflows/wraps live; the whole page
  also re-lays-out on window resize. Content taller than the viewport (e.g.
  the stacked mobile layout below 600px) scrolls via wheel/touch-drag,
  handled by Clay's own scroll-container machinery (Clay_SetPointerState +
  Clay_UpdateScrollContainers, fed pointer/wheel state renderer.js tracks)
  the same way third_party/clay/examples/clay-official-website does it --
  the browser's own scrolling stays disabled on purpose (see overflow:
  hidden / touch-action: none below) so the layout keeps behaving like a
  fixed canvas and Clay's virtual scroll offset is the only thing moving
  content around.

  Usage:
    1. Build libclay_wasm.a (once, or after changing wrapper.c): same recipe
       as libclay.a's own build, with emcc instead of gcc --
         emcc -fPIC -c wrapper.c -o wrapper_wasm.o -I. && \
         ar rcs libclay_wasm.a wrapper_wasm.o && rm wrapper_wasm.o
    2. yap -bcc=emcc -bexport=app_init -bexport=app_update \
           -bexport=app_get_draw_commands -bexport=app_get_draw_command_count \
           -o docs/laydoh_demo.js examples/demo_wasm.yp
    3. python3 -m http.server (from this directory)
    4. open http://localhost:8000/

  (steps 1-2 are also just `make wasm_demo` from the repo root.)

  laydoh_demo.js/.wasm are committed as checked-in build artifacts so steps
  3/4 work even without a yap+emcc toolchain on hand; re-run steps 1-2 after
  changing wrapper.c/demo_wasm.yp to refresh them. Lives under docs/ (not
  examples/web/) because GitHub Pages only serves a repo's root or /docs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>laydoh demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* Scrolling is implemented by Clay (see renderer.js/demo_wasm.yp), not
       the browser -- touch-action: none here (matching where
       third_party/clay/examples/clay-official-website/index.html puts it,
       on its own top-level input surface) stops mobile browsers from also
       trying to pan/bounce/navigate on their own in response to the same
       touch input, at the broadest level rather than relying on it
       propagating down from a single inner element. */
    touch-action: none;
    background: #13181f;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  .cmd-rect { position: absolute; }
  .cmd-text {
    position: absolute;
    white-space: pre-wrap;
    line-height: 1.2;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <script src="renderer.js"></script>
  <script src="laydoh_demo.js"></script>
</body>
</html>

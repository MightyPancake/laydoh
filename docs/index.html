<!--
  laydoh demo - Clay layout logic written in yap, running in the
  browser via yap's -bcc=emcc backend. Card 0 (bottom-left) animates its own
  width every frame so its text visibly reflows/wraps live; the whole page
  also re-lays-out on window resize. Content taller than the viewport (e.g.
  the stacked mobile layout below 600px) scrolls NATIVELY -- #stage is a real
  overflow-y: auto viewport, #content inside it gets an explicit height
  (renderer.js, set from Clay's own computed content height every frame) so
  the browser always has something real to scroll. This matches how
  third_party/clay/examples/clay-official-website's DOM/HTML-overlay renderer
  mode does it (Clay_SetExternalScrollHandlingEnabled(true) +
  Clay_SetCullingEnabled(false) on the wasm side, see demo_wasm.yp) -- NOT
  its canvas renderer mode, which uses Clay's own virtual scroll instead and
  was the wrong reference for a div-based renderer like this one (an earlier
  version of this file copied that one, which felt jagged on real mobile
  touch scrolling since it depends on keeping a full relayout + full DOM
  rebuild in sync with 60fps+ touch input on the main thread).

  Usage:
    1. Build libclay_wasm.a (once, or after changing wrapper.c): same recipe
       as libclay.a's own build, with emcc instead of gcc --
         emcc -fPIC -c wrapper.c -o wrapper_wasm.o -I. && \
         ar rcs libclay_wasm.a wrapper_wasm.o && rm wrapper_wasm.o
    2. yap -bcc=emcc -bexport=app_init -bexport=app_update \
           -bexport=app_get_draw_commands -bexport=app_get_draw_command_count \
           -o docs/laydoh_demo.js examples/demo_wasm.yp
    3. python3 -m http.server (from this directory)
    4. open http://localhost:8000/

  (steps 1-2 are also just `make wasm_demo` from the repo root.)

  laydoh_demo.js/.wasm are committed as checked-in build artifacts so steps
  3/4 work even without a yap+emcc toolchain on hand; re-run steps 1-2 after
  changing wrapper.c/demo_wasm.yp to refresh them. Lives under docs/ (not
  examples/web/) because GitHub Pages only serves a repo's root or /docs.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>laydoh demo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    /* html/body themselves are never the scrolling element (that's #stage
       below) -- overflow: hidden here just prevents a redundant/competing
       outer scrollbar or bounce region from also existing. Deliberately NOT
       touch-action: none: that would disable panning for #stage's own
       touch-action: pan-y too (a "none" on any ancestor wins over a
       descendant's own value), which would break native touch scroll
       entirely. */
    overflow: hidden;
    background: #13181f;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    /* pan-y (not none): allows native vertical touch-scroll, but still lets
       the browser treat horizontal drags as "not a scroll gesture" here
       (matching the layout itself, which is always exactly viewport-width by
       construction, so horizontal scroll should never be reachable). */
    touch-action: pan-y;
  }
  /* The actual scrollable content -- height is set from JS every frame to
     Clay's own computed content height (see renderer.js), since #stage's
     absolutely-positioned children don't otherwise contribute to any
     element's auto height for the browser to know how far it can scroll. */
  #content {
    position: relative;
    width: 100%;
  }
  .cmd-rect { position: absolute; }
  .cmd-text {
    position: absolute;
    white-space: pre-wrap;
    line-height: 1.2;
    overflow: hidden;
  }
</style>
</head>
<body>
  <div id="stage"><div id="content"></div></div>
  <script src="renderer.js"></script>
  <script src="laydoh_demo.js"></script>
</body>
</html>
